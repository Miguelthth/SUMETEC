<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#023561">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logos/sumetec-direccion.png" type="image/png">
  <link rel="apple-touch-icon" href="logos/sumetec-direccion.png">
  <!-- tema-inicial.js va ANTES del CSS (elige día/noche sin parpadeo) --
       mismo tema del ERP, generado por 16.- IDENTIDAD-NEGOCIO/generar_tema.py.
       No editar sumetec-tema.css ni tema-inicial.js a mano. -->
  <script src="tema-inicial.js"></script>
  <link rel="stylesheet" href="sumetec-tema.css">
  <link rel="stylesheet" href="actualizacion.css">
  <link rel="stylesheet" href="estilos.css?v=20260914b">
  <title>SUMETEC Dirección</title>
</head>
<body>
  <header class="sm-barra">
    <i class="bi bi-shop" aria-hidden="true"></i>
    <span class="sm-barra-titulo">SUMETEC Dirección</span>
    <button type="button" id="estado" class="sm-chip sm-chip-boton" style="margin-left:auto"><span class="sm-chip-punto" aria-hidden="true"></span><span id="estado-texto">Sin conexión</span></button>
    <button type="button" class="btn-barra" id="btnMasMenu" aria-haspopup="true" aria-expanded="false" aria-controls="masMenu" aria-label="Más opciones"><i class="bi bi-list"></i></button>
  </header>

  <div id="masMenu" class="mas-menu" style="display:none" hidden>
    <div class="mas-menu-grupo">
      <span class="mas-menu-titulo">Este celular</span>
      <button type="button" id="menuEnviarPendientes"><i class="bi bi-cloud-arrow-up"></i> Enviar movimientos pendientes</button>
    </div>
    <div class="mas-menu-grupo">
      <span class="mas-menu-titulo">Ajustes</span>
      <button type="button" onclick="alternarTemaSumetec()"><i class="bi bi-moon-stars"></i> Modo claro / oscuro</button>
      <button type="button" onclick="_mostrarVersionInstalada()"><i class="bi bi-info-circle"></i> Actualización de software</button>
      <button type="button" id="menuVincular"><i class="bi bi-phone"></i> Vincular otro teléfono</button>
    </div>
  </div>

  <div class="hoja">
    <nav class="sm-nav">
      <button data-vista="resumen" class="btn-nav">Resumen</button>
      <button data-vista="caja" class="btn-nav">Caja</button>
      <button data-vista="corte" class="btn-nav">Corte</button>
      <button data-vista="inventario" class="btn-nav">Inventario</button>
    </nav>
    <main id="app"></main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <dialog id="vincular">
    <form method="dialog">
      <h2>Vincular este teléfono</h2>
      <label class="form-label" for="url">URL de Drive</label>
      <input id="url" class="form-control" placeholder="URL de Drive">
      <label class="form-label" for="codigo">Código de 6 dígitos</label>
      <input id="codigo" class="form-control" inputmode="numeric" placeholder="Código de 6 dígitos">
      <label class="form-label" for="pin">PIN privado</label>
      <input id="pin" class="form-control" type="password" inputmode="numeric" placeholder="PIN privado">
      <button id="enlazar" class="btn btn-success btn-bloque" value="default"><i class="bi bi-check-circle"></i> Vincular</button>
    </form>
  </dialog>

  <dialog id="pin-modal">
    <form method="dialog">
      <h2>PIN privado</h2>
      <label class="form-label" for="pin-modal-input">PIN</label>
      <input id="pin-modal-input" class="form-control" type="password" inputmode="numeric" autocomplete="off" required>
      <p id="pin-modal-error" class="text-rojo" role="alert"></p>
      <div class="fila">
        <button value="cancel" class="btn btn-outline-secondary" formnovalidate>Cancelar</button>
        <button value="ok" class="btn btn-success"><i class="bi bi-check-circle"></i> Continuar</button>
      </div>
    </form>
  </dialog>

  <script src="version.js"></script>
  <script src="seguridad.js"></script>
  <script src="caja.js"></script>
  <script src="corte.js"></script>
  <script src="dashboard.js"></script>
  <script src="inventario.js"></script>
  <script src="app.js"></script>
  <div id="sumetecActualizacion" role="status" aria-live="assertive"><div class="sumetec-actualizacion-tarjeta"><span class="sumetec-engranaje">⚙</span><strong>Actualizando SUMETEC</strong><p>Espera un momento…</p></div></div>
  <script src="actualizacion.js"></script>
</body>
</html>
